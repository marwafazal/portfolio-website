name: ci-wf

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install --save-dev htmlhint stylelint

      - name: Lint HTML files
        run: npx htmlhint src/**/*.html
        
      - name: Lint CSS files
        run: npx stylelint styles/**/*.css
